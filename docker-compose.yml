version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: 1bus
      POSTGRES_USER: antonkuznecov
      POSTGRES_PASSWORD: sam-aan2020
    ports:
      - "5432:5432"   # если нужно внешнее подключение – оставьте, иначе удалите
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antonkuznecov -d 1bus"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  web:
    build: .
    container_name: django_app
    env_file:
      - .env
    volumes:
      - static_volume:/app/static   # только для статики, код не монтируем
      - media_volume:/app/media     # для медиа
    depends_on:
      db:
        condition: service_healthy
    restart: always
    # Команда запуска берётся из Dockerfile (CMD)

  nginx:
    image: nginx:1.21
    container_name: nginx_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static
      - media_volume:/media
    ports:
      - "80:80"
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume: