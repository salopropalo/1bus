<!-- Фиксированный подвал -->
{% load static %}
{% load filters %}
<div class="fixed-bottom border-top bg-white py-2 px-4 d-print-none">
    <div class="row justify-content-between align-items-center">
        <div class="col-auto">
            <button type="button" class="btn btn-success"
                    data-bs-toggle="modal" data-bs-target="#exampleModal">
                Добавить секцию
            </button>
        </div>
        <div class="col-auto">
            <form method="post" id="cancelForm" style="display: none;">
                {% csrf_token %}
                <input type="hidden" name="cancelled_ids" id="cancelled_ids_input">
                <button type="submit" name="apply_cancel" class="btn btn-danger">
                    Применить отмену
                </button>
            </form>
        </div>
        <div class="col-auto">
            <a href="{% url 'transaction_print' obj.uuid %}"
               target="_blank"
               class="btn btn-outline-secondary">

                🖨 Печать

            </a>

            <a href="{% url 'transaction_pdf' obj.uuid %}"
               class="btn btn-danger">

                📄 PDF

            </a>
        </div>
    </div>
</div>
