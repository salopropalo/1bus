{% extends 'reg/base.html' %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-center"><h1> {{ title }}</h1></div>
    <div class="row gy-2">

        <!-- Модальное окно для создания ЦВ -->
        <div class="modal fade" id="exampleModalOrder" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">{{ title2 }}</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                    </div>
                    <div class="modal-body">
                        <form method="post" enctype="multipart/form-data">  <!-- Добавлен атрибут enctype -->
                            {% csrf_token %}
                            <!-- Здесь будет форма для расчета материалов -->
                            {{ form_order.as_p }}
                            <div class="modal-footer">
                                <button type="submit" name="form_type" value="order" class="btn btn-primary">Отправить</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Модальное окно для расчета материалов -->
        <div class="modal fade" id="exampleModalMaterials" tabindex="0" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel1">{{ title3 }}</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                    </div>
                    <div class="modal-body">
                        <form method="post" enctype="multipart/form-data">  <!-- Добавлен атрибут enctype -->
                            {% csrf_token %}
                            <!-- Здесь будет форма для расчета материалов -->
                            {{ form_materials.as_p }}
                            <div class="modal-footer">
                                <button type="submit" name="form_type" value="materials" class="btn btn-primary">Отправить</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Кнопка-триггер для создания РД -->
        <div class="input-group mb-3">
            <div class="input-group-prepend">
                <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#exampleModalOrder">
                    Создать РД
                </button>
            </div>
        </div>

        <!-- Кнопка-триггер для создания расчета материалов -->
        <div class="input-group mb-3">
            <div class="input-group-prepend">
                <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#exampleModalMaterials">
                    Создать расчет материалов
                </button>
            </div>
        </div>
    </div>
</div>


{% endblock %}
